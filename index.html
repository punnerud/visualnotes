<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>visualnotes · noter og grep</title>
<meta name="description" content="Spill sanger tone for tone med ekte grep. Sangen ligger i URL-en, så en LLM kan lage den. Norsk, svensk, dansk og engelsk.">
<meta name="color-scheme" content="dark light">
<style id="pageStyle">@page{size:A4 portrait;margin:10mm}</style>
<style>
  :root{
    --navy:#22304f; --navy-deep:#19233d; --paper:#fbf7ee; --ink:#1c1712;
    --gold:#f2b234; --line:#e7dfcd; --muted:#9a8f79; --sky:#c9d3ea;
    --card-w:86px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    min-height:100dvh;display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--navy) 0%,var(--navy-deep) 100%);
    color:var(--paper);
    font-family:ui-rounded,"SF Pro Rounded","Nunito","Trebuchet MS",system-ui,-apple-system,sans-serif;
    overflow-x:hidden;
  }
  main{flex:1;display:flex;flex-direction:column;min-height:0}
  button{font:inherit;border:0;cursor:pointer;border-radius:999px;font-weight:800;color:inherit}

  /* ---------- Topplinje ---------- */
  .topbar{
    display:flex;align-items:center;gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 8px;
  }
  .tb-text{flex:1;min-width:0}
  .tb-title{font-size:16px;font-weight:800;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-meta{font-size:11.5px;font-weight:600;color:var(--sky);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .iconbtn{
    width:40px;height:40px;flex:0 0 auto;display:grid;place-items:center;font-size:19px;
    background:rgba(251,247,238,.1);border:1px solid rgba(251,247,238,.2);
  }
  .iconbtn:hover{background:rgba(251,247,238,.18)}

  /* ---------- Tonerekka ---------- */
  .strip{
    display:flex;align-items:stretch;gap:8px;width:100%;
    overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
    padding:14px calc(50vw - 60px) 12px;
    scrollbar-width:thin;cursor:grab;
  }
  .strip.grabbing,.strip.grabbing .note{cursor:grabbing;user-select:none}
  .strip::-webkit-scrollbar{height:8px}
  .strip::-webkit-scrollbar-thumb{background:rgba(251,247,238,.25);border-radius:4px}

  .note{
    flex:0 0 auto;width:var(--w,86px);
    background:var(--paper);color:var(--ink);
    border:2px solid var(--line);border-radius:18px;
    padding:10px 4px 6px;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px;
    cursor:pointer;
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
  }
  .note .fingwrap{height:clamp(92px,21vh,164px);width:100%;display:flex;align-items:center;justify-content:center}
  .note .fingwrap svg{height:100%;width:auto;max-width:100%}
  .note .fingwrap svg.fing-keys,.note .fingwrap svg.fing-slide{height:auto;width:100%}
  .note.nofing .fingwrap{height:auto}
  .note .name{font-size:24px;font-weight:800;line-height:1;letter-spacing:-.02em}
  .note .name small{font-size:13px;opacity:.55;font-weight:700}
  .note .staffwrap{width:100%;display:flex;justify-content:center}
  .note .staffwrap svg{width:100%;height:auto;max-width:150px}
  .strip .note .staffwrap{display:none}      /* notene bor i båndet — utskrift beholder sin */
  .note .lyric{font-size:12px;font-weight:700;color:#6b6250;min-height:14px}
  .note .fingtxt{font-size:11px;font-weight:800;color:#6b6250;letter-spacing:.06em}
  .note.rest .name{color:var(--muted)}
  .note.out{opacity:.45}
  .note.current{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold),0 12px 24px rgba(0,0,0,.4);transform:translateY(-6px)}
  .note.beat{box-shadow:0 0 0 3px var(--gold),0 0 26px rgba(242,178,52,.6)}
  /* ---------- Loddrett modus: tonene faller nedover ---------- */
  .strip.vert{
    display:block;position:relative;overflow:hidden;flex:1 1 auto;min-height:240px;
    padding:0;touch-action:none;cursor:grab;
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 9%);
            mask-image:linear-gradient(180deg,transparent,#000 9%);
  }
  .strip.vert.grabbing{cursor:grabbing;user-select:none}
  .vlane{
    position:absolute;left:0;right:0;bottom:0;
    display:flex;flex-direction:column-reverse;align-items:center;
    will-change:transform;
  }
  .strip.vert .note{
    width:min(94vw,330px);height:var(--h);
    flex-direction:row;align-items:center;justify-content:flex-start;
    gap:0;padding:3px 12px;border-radius:14px;overflow:hidden;transform:none;
  }
  .strip.vert .note.done{opacity:.5}
  .strip.vert .note.current{opacity:1;transform:none;box-shadow:0 0 0 3px var(--gold),0 8px 22px rgba(0,0,0,.45)}
  .strip.vert .note .fingwrap{flex:0 0 auto;width:auto;height:auto;max-height:86px;max-width:54%}
  .strip.vert .note .fingwrap svg{height:auto;width:auto;max-height:86px;max-width:100%}
  .strip.vert .note .name{margin:0 16px;font-size:26px}
  .strip.vert .note .lyric{margin-left:auto;padding-right:4px}
  .strip.vert .note.barstart{border-bottom-color:rgba(28,23,18,.45)}
  .strip.vert .note.phrasestart{border-bottom:3px solid rgba(28,23,18,.65)}
  /* ---------- Notebåndet ----------
     Én sammenhengende notelinje som glir jevnt mot venstre. Ligger i vanlig flyt
     under kortene i vannrett modus, og som et bånd tvers over ved landingslinja
     i fallende modus, der kortene faller bak det. */
  .sband{
    position:relative;height:94px;overflow:visible;
    background:var(--paper);
    border-top:3px solid var(--gold);border-bottom:1px solid rgba(28,23,18,.25);
  }
  .sband.inflow{margin:0 0 10px}
  .sband.overlay{position:absolute;left:0;right:0;z-index:2;box-shadow:0 10px 26px rgba(0,0,0,.45)}
  .swin{position:absolute;inset:0;overflow:hidden}
  .slane{position:absolute;left:0;top:8px;height:78px;display:flex;will-change:transform}
  .sseg{flex:0 0 auto;height:78px;cursor:pointer;transition:opacity .15s ease}
  .sseg.done{opacity:.42}
  .sseg.on{opacity:1;background:rgba(242,178,52,.22)}
  .sseg:hover{background:rgba(242,178,52,.12)}
  .sseg svg{display:block}
  .splayhead{
    position:absolute;left:50%;top:-14px;bottom:0;width:2px;margin-left:-1px;z-index:3;
    background:var(--gold);border-radius:2px;pointer-events:none;
    box-shadow:0 0 10px rgba(242,178,52,.9);
  }
  .splayhead::before{
    content:"";position:absolute;left:-4px;top:0;
    border-left:5px solid transparent;border-right:5px solid transparent;
    border-top:7px solid var(--gold);
  }

  .gap{margin-left:18px}
  .gap2{margin-left:34px}
  .barline{flex:0 0 auto;width:3px;align-self:stretch;margin:16px 3px;background:rgba(251,247,238,.35);border-radius:2px}

  /* ---------- Info ---------- */
  .info{padding:6px 16px 10px;text-align:center}
  .legend{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px}
  .pill{
    display:inline-flex;align-items:center;gap:7px;
    background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 13px;
    font-size:13px;font-weight:700;border:0;
  }
  .pill.ghost{background:transparent;color:var(--paper);border:2px solid rgba(251,247,238,.35)}
  .dot{width:15px;height:15px;border-radius:50%;border:2.5px solid var(--ink);background:#fff}
  .dot.on{background:var(--ink)}
  .dot.half{background:linear-gradient(180deg,#fff 50%,var(--ink) 50%)}
  .hint{margin-top:9px;font-size:12px;font-weight:600;color:#8fa0c4}
  .warn{margin-top:8px;font-size:12px;font-weight:700;color:#ffc9c9}

  /* ---------- Bunnlinje ---------- */
  .controls{
    position:sticky;bottom:0;display:flex;flex-direction:column;align-items:center;gap:9px;
    padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    background:var(--navy-deep);border-top:1px solid rgba(251,247,238,.12);
    box-shadow:0 -8px 20px rgba(0,0,0,.3);
  }
  .crow{display:flex;align-items:center;justify-content:center;gap:10px}
  .tempo{display:inline-flex;align-items:center;gap:4px;padding:4px;
    background:rgba(251,247,238,.08);border:1px solid rgba(251,247,238,.16);border-radius:999px}
  .tstep{width:36px;height:36px;border-radius:50%;background:rgba(251,247,238,.14);
    color:var(--paper);font-size:20px;line-height:1;display:grid;place-items:center}
  .tstep:active{transform:scale(.94)}
  .tstep:disabled{opacity:.3;pointer-events:none}
  .tval{background:transparent;padding:2px 10px;display:flex;align-items:baseline;gap:5px;
    font-variant-numeric:tabular-nums;border-radius:999px}
  .tval b{font-size:18px;color:var(--gold);line-height:1}
  .tval span{font-size:11px;font-weight:700;color:var(--sky)}
  .tval:hover b{text-decoration:underline dotted}
  .tinput{width:70px;text-align:center;padding:5px 6px;font-size:17px;font-weight:800;
    color:var(--gold);background:rgba(0,0,0,.3);border:1px solid var(--gold);border-radius:12px}
  .tinput::-webkit-outer-spin-button,.tinput::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .treset{padding:5px 10px;font-size:11.5px;font-weight:700;color:var(--sky);
    background:rgba(251,247,238,.12);border-radius:999px;font-variant-numeric:tabular-nums}
  .nav{padding:14px 22px;font-size:16px;transition:transform .1s ease}
  .nav:active{transform:scale(.95)}
  .nav:focus-visible,.iconbtn:focus-visible,.pill:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  #next,#prev{background:transparent;color:var(--paper);border:2px solid rgba(251,247,238,.45)}
  #playBtn{background:var(--gold);color:var(--ink);padding:14px 26px;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
  #playBtn.on{background:#ff9f76}
  .nav:disabled{opacity:.3;pointer-events:none}
  .counter{min-width:62px;text-align:center;font-weight:700;font-size:12px;color:var(--sky);font-variant-numeric:tabular-nums}
  .counter b{display:block;font-size:22px;color:var(--gold);line-height:1.1}

  /* ---------- Panel ---------- */
  .sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,14,26,.62)}
  .sheet[hidden]{display:none}
  .sheet-inner{
    width:min(640px,100%);max-height:86vh;overflow:auto;
    background:var(--navy-deep);border-radius:22px 22px 0 0;
    border:1px solid rgba(251,247,238,.16);border-bottom:0;
    padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  }
  .sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;position:sticky;top:-16px;background:var(--navy-deep);padding-top:4px;z-index:1}
  .sheet-head h2{flex:1;font-size:17px;font-weight:800}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(251,247,238,.1)}
  .row:last-child{border-bottom:0}
  .row label{font-size:14px;font-weight:700}
  .row .sub{display:block;font-size:11.5px;font-weight:600;color:var(--sky);opacity:.8;margin-top:2px}
  .seg{display:flex;flex-wrap:wrap;gap:6px}
  .seg button{
    padding:8px 12px;font-size:13px;background:rgba(251,247,238,.09);
    border:1px solid rgba(251,247,238,.18);border-radius:12px;
  }
  .seg button.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
  select,input[type=text],textarea{
    font:inherit;font-size:14px;font-weight:600;
    background:rgba(251,247,238,.1);color:var(--paper);
    border:1px solid rgba(251,247,238,.22);border-radius:12px;padding:9px 10px;max-width:100%;
  }
  select option{background:var(--navy-deep);color:var(--paper)}
  textarea{width:100%;min-height:90px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
  input[type=range]{width:150px;accent-color:var(--gold)}
  .switch{width:52px;height:30px;border-radius:999px;background:rgba(251,247,238,.18);position:relative;flex:0 0 auto;border:0}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--paper);transition:transform .16s ease}
  .switch.on{background:var(--gold)}
  .switch.on::after{transform:translateX(22px)}
  .songlist{display:flex;flex-direction:column;gap:6px}
  .songitem{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;
    background:rgba(251,247,238,.08);border:1px solid rgba(251,247,238,.14);border-radius:14px;padding:11px 13px;width:100%}
  .songitem.on{border-color:var(--gold)}
  .songitem b{font-size:14.5px;font-weight:800}
  .songitem span{font-size:11.5px;font-weight:600;color:var(--sky);opacity:.8}
  .urlbox.prompt{white-space:pre-wrap;word-break:normal;overflow-wrap:anywhere;max-height:42vh;overflow:auto}
  .urlbox{width:100%;word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12px;background:rgba(0,0,0,.28);border-radius:12px;padding:10px;line-height:1.5;color:#dfe6f5}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .btnrow button{padding:10px 15px;font-size:13.5px;background:rgba(251,247,238,.12);border:1px solid rgba(251,247,238,.22)}
  .btnrow button.gold{background:var(--gold);color:var(--ink);border-color:var(--gold)}
  .addbtn{flex:0 0 auto;padding:8px 13px;font-size:12.5px;font-weight:700;color:var(--ink);
    background:var(--paper);border-radius:999px;max-width:60%;text-align:center;line-height:1.25}
  .addbtn:hover{background:#fff}
  code.k{background:rgba(0,0,0,.3);border-radius:6px;padding:1px 5px;font-size:12px}

  /* ---------- Utskrift ---------- */
  .printview{position:fixed;inset:0;z-index:50;background:#e8ebf2;overflow:auto}
  .printview[hidden]{display:none}
  .ptools{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:9px;
    background:var(--navy-deep);padding:12px 14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
  .pgroup{display:inline-flex;align-items:center;gap:8px;background:rgba(251,247,238,.1);border-radius:999px;
    padding:5px 8px 5px 12px;color:var(--sky);font-size:13px;font-weight:700}
  .pgroup b{min-width:66px;text-align:center;color:var(--paper);font-size:14px;font-variant-numeric:tabular-nums}
  .pstep{width:34px;height:34px;border-radius:50%;background:var(--paper);color:var(--ink);font-size:18px;line-height:1}
  .ptool{padding:10px 15px;background:transparent;color:var(--paper);border:2px solid rgba(251,247,238,.45);font-size:13.5px}
  .pgold{background:var(--gold);color:var(--ink);border:0;box-shadow:0 3px 0 rgba(0,0,0,.35)}
  .ptip{max-width:640px;margin:12px auto -4px;padding:0 14px;text-align:center;
    font-size:12px;font-weight:600;color:#5c6883;line-height:1.5}
  .psheet{background:#fff;color:var(--ink);width:210mm;margin:14px auto 50px;padding:10mm;border-radius:6px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);print-color-adjust:exact;-webkit-print-color-adjust:exact}
  .psheet.land{width:297mm}
  .ptitle{font-size:20px;font-weight:800;margin-bottom:2px}
  .psub{font-size:12px;font-weight:600;color:#6b6250;margin-bottom:12px}
  .pgrid{display:flex;flex-direction:column;gap:10px}
  .prow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;break-inside:avoid;page-break-inside:avoid}
  .pgrid .note{cursor:default;box-shadow:none;break-inside:avoid;page-break-inside:avoid}
  .pgrid .barline{background:#c9bfa6}
  .plegend{margin-top:14px;font-size:11.5px;font-weight:600;color:#6b6250;line-height:1.6}

  @media print{
    body{background:#fff;display:block}
    main,.controls,.topbar,.sheet{display:none !important}
    .printview{position:static;background:#fff;overflow:visible}
    .ptools,.ptip{display:none}
    .psheet{width:auto !important;margin:0;padding:0;box-shadow:none;border-radius:0}
    .note{border-color:#d8d0bd !important}
  }
  @media (max-width:520px){
    .strip{padding-left:calc(50vw - 54px);padding-right:calc(50vw - 54px)}
    .nav{padding:13px 16px;font-size:15px}
  }
  @media (prefers-reduced-motion: reduce){ .note,.nav,.switch::after,.sseg{transition:none} }
  @media print{ .sband{display:none} }
</style>
</head>
<body>
<header class="topbar">
  <div class="tb-text">
    <div class="tb-title" id="tbTitle">♪</div>
    <div class="tb-meta" id="tbMeta"></div>
  </div>
  <button class="iconbtn" id="openAi" title="AI">🤖</button>
  <button class="iconbtn" id="openSongs" title="Sanger">♫</button>
  <button class="iconbtn" id="openShare" title="Del">🔗</button>
  <button class="iconbtn" id="openSettings" title="Innstillinger">⚙</button>
</header>

<main>
  <div class="strip" id="strip" aria-label="Toner med grep"></div>
  <div class="sband inflow" id="sband" aria-hidden="true">
    <div class="swin"><div class="slane" id="slane"></div></div>
    <div class="splayhead"></div>
  </div>
  <div class="info">
    <div class="legend" id="legend"></div>
    <p class="hint" id="hint"></p>
    <p class="warn" id="warn" hidden></p>
  </div>
</main>

<div class="controls">
  <div class="crow">
    <div class="tempo">
      <button class="tstep" id="bpmM">−</button>
      <button class="tval" id="bpmVal"><b id="bpmNum">100</b><span>BPM</span></button>
      <input class="tinput" id="bpmInput" type="number" inputmode="numeric" min="30" max="240" step="1" hidden>
      <button class="treset" id="bpmReset" hidden>↺</button>
      <button class="tstep" id="bpmP">+</button>
    </div>
  </div>
  <div class="crow">
    <button class="nav" id="prev">◀</button>
    <div class="counter"><b id="pos">1</b><span id="ofTotal">av 1</span></div>
    <button class="nav" id="playBtn">▶</button>
    <button class="nav" id="next">▶</button>
  </div>
</div>

<!-- Innstillinger -->
<div class="sheet" id="settings" hidden>
  <div class="sheet-inner">
    <div class="sheet-head"><h2 id="setTitle">Innstillinger</h2><button class="iconbtn" data-close="settings">✕</button></div>
    <div id="setBody"></div>
  </div>
</div>

<!-- Sanger -->
<div class="sheet" id="songs" hidden>
  <div class="sheet-inner">
    <div class="sheet-head"><h2 id="songsTitle">Sanger</h2><button class="iconbtn" data-close="songs">✕</button></div>
    <div class="songlist" id="songList"></div>
    <p class="hint" id="songsNote"></p>
  </div>
</div>

<!-- AI-prompt -->
<div class="sheet" id="ai" hidden>
  <div class="sheet-inner">
    <div class="sheet-head"><h2 id="aiTitle">AI-prompt</h2><button class="iconbtn" data-close="ai">✕</button></div>
    <div id="aiBody"></div>
  </div>
</div>

<!-- Del / rediger -->
<div class="sheet" id="share" hidden>
  <div class="sheet-inner">
    <div class="sheet-head"><h2 id="shareTitle">Del</h2><button class="iconbtn" data-close="share">✕</button></div>
    <div id="shareBody"></div>
  </div>
</div>

<!-- Utskrift -->
<div class="printview" id="printview" hidden>
  <div class="ptools">
    <button class="ptool pgold" id="doPrint">🖨</button>
    <div class="pgroup"><span id="perLineLbl">Per linje</span>
      <button class="pstep" id="rowM">−</button><b id="rowVal">11</b><button class="pstep" id="rowP">+</button></div>
    <div class="pgroup"><span>Zoom</span>
      <button class="pstep" id="zM">−</button><b id="zVal">60%</b><button class="pstep" id="zP">+</button></div>
    <button class="ptool" id="orient">A4</button>
    <button class="ptool" id="pclose">✕</button>
  </div>
  <p class="ptip" id="ptip"></p>
  <div class="psheet" id="psheet">
    <h2 class="ptitle" id="ptitle">♪</h2>
    <p class="psub" id="psub"></p>
    <div class="pgrid" id="pgrid"></div>
    <p class="plegend" id="plegend"></p>
  </div>
</div>
<script>
'use strict';
/* ================================================================
   Kjerne: tonemodell, transponering, instrumenter
   Deler av denne fila er hentet fra punnerud/notecircle (samme forfatter).
   ================================================================ */

const LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
const LETTER_SEMIS = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const LETTER_FIFTHS = { C: 0, D: 2, E: 4, F: -1, G: 1, A: 3, B: 5 };

function noteMidi(n) { return 12 * (n.oct + 1) + LETTER_SEMIS[n.letter] + n.alt; }
function diaIndex(n) { return n.oct * 7 + LETTERS.indexOf(n.letter); }
function fifthsOf(t) { return LETTER_FIFTHS[t.letter] + 7 * t.alt; }
function tonicFromFifths(f) {
  const idx = (((f + 1) % 7) + 7) % 7;
  return { letter: 'FCGDAEB'[idx], alt: Math.floor((f + 1) / 7) };
}
// Respell om stavemåten havner utenfor de 15 standardsignaturene (unngår dobbeltkryss).
function normalizeSpelling(out) {
  const sig = fifthsOf(out);
  if (sig > 7) return tonicFromFifths(sig - 12);
  if (sig < -7) return tonicFromFifths(sig + 12);
  return out;
}

/* Transponer en stavemåte (letter/alt/oct) med (letters, semis).
   skrevet = klingende + (letters, semis) — samme konvensjon som notecircle. */
function transposeBy(n, letters, semis) {
  if (!letters && !semis) return { letter: n.letter, alt: n.alt, oct: n.oct };
  const i = LETTERS.indexOf(n.letter);
  const li = i + letters;
  const nl = LETTERS[((li % 7) + 7) % 7];
  const octShift = Math.floor(li / 7);
  const base = LETTER_SEMIS[n.letter] + n.alt;
  const naturalRel = LETTER_SEMIS[nl] + 12 * octShift;
  const sp = normalizeSpelling({ letter: nl, alt: base + semis - naturalRel });
  // Oktav settes fra faktisk midi, slik at respelling ikke flytter tonen
  const target = noteMidi(n) + semis;
  let oct = n.oct + octShift;
  const guess = () => 12 * (oct + 1) + LETTER_SEMIS[sp.letter] + sp.alt;
  while (guess() - target >= 12) oct--;
  while (target - guess() >= 12) oct++;
  return { letter: sp.letter, alt: sp.alt, oct };
}

/* Enkel stavemåte fra midi (brukes når URL-en oppgir ventiltall e.l.) */
const SHARP_SPELL = [['C',0],['C',1],['D',0],['E',-1],['E',0],['F',0],['F',1],['G',0],['A',-1],['A',0],['B',-1],['B',0]];
function spellMidi(m) {
  const pc = ((m % 12) + 12) % 12;
  const [letter, alt] = SHARP_SPELL[pc];
  const oct = Math.floor(m / 12) - 1 - (letter === 'B' && alt === 0 && pc === 11 ? 0 : 0);
  const n = { letter, alt, oct };
  // juster oktav slik at midi stemmer (Cb/B# forekommer ikke i tabellen over)
  n.oct += Math.round((m - noteMidi(n)) / 12);
  return n;
}

/* ---------- Klaffoppsett (viewBox-koordinater) ---------- */
function woodwindLayout(opts) {
  const o = opts || {};
  const k = [];
  const push = (id, x, y, r, label, shape) => k.push({ id, x, y, r, label: label || '', shape: shape || 'circle' });
  if (o.thumb) push('T', 11, 22, 7.5, o.thumbLabel || '');
  if (o.reg) push('R', 11, 44, 6, o.regLabel || '');
  push('l1', 36, 22, 10.5); push('l2', 36, 48, 10.5); push('l3', 36, 74, 10.5);
  push('r1', 36, 108, 10.5); push('r2', 36, 134, 10.5); push('r3', 36, 160, 10.5);
  (o.side || []).forEach((s, i) => push(s.id, 58, 30 + i * 16, 5, s.label));
  (o.lpinky || []).forEach((s, i) => push(s.id, 12, 92 + i * 15, 5.5, s.label));
  (o.rpinky || []).forEach((s, i) => push(s.id, 58, 150 + i * 15, 5.5, s.label));
  (o.palm || []).forEach((s, i) => push(s.id, 12, 132 + i * 15, 5.5, s.label));
  return { w: 70, h: 182, keys: k };
}

/* ---------- Ventilgrep (messing) ---------- */
// Ventilkombinasjon -> hvor mange halvtoner den senker
const VALVE_DROP = { '0': 0, '2': 1, '1': 2, '12': 3, '23': 4, '13': 5, '123': 6 };
const DROP_VALVE = ['0', '2', '1', '12', '23', '13', '123'];

// Overtoner som faktisk brukes (partial-nummer), 7/11/13/14 utelatt (for falske)
const USABLE_PARTIALS = [2, 3, 4, 5, 6, 8, 9, 10, 12, 16];
function partialMidis(rootMidi) {
  return USABLE_PARTIALS.map(n => rootMidi + Math.round(12 * Math.log2(n)));
}
// Generisk messinggrep: minste senking som treffer en brukbar overtone
function harmonicFingering(midi, rootMidi, maxDrop) {
  const parts = partialMidis(rootMidi);
  const hits = [];
  for (let d = 0; d <= (maxDrop === undefined ? 6 : maxDrop); d++) {
    if (parts.indexOf(midi + d) >= 0) hits.push(d);
  }
  if (!hits.length) return null;
  return { drop: hits[0], alts: hits.slice(1) };
}

/* ---------- Blokkfløyte (barokk-/engelskgrep som standard) ----------
   Grunnskjema etter Dolmetsch «Baroque / English Recorder Fingering Chart».
   Indeksert i halvtoner over instrumentets laveste tone (C for sopran, F for alt).
   Andre oktav fra 15 og opp: klemgrep (halvt tommelhull) + samme grep som oktaven under. */
const RECORDER_BAROQUE = {
  0:  ['T', '1', '2', '3', '4', '5', '6', '6b', '7', '7b'],
  1:  ['T', '1', '2', '3', '4', '5', '6', '6b', '7'],
  2:  ['T', '1', '2', '3', '4', '5', '6', '6b'],
  3:  ['T', '1', '2', '3', '4', '5', '6'],
  4:  ['T', '1', '2', '3', '4', '5'],
  5:  ['T', '1', '2', '3', '4', '6', '6b', '7', '7b'],
  6:  ['T', '1', '2', '3', '5', '6', '6b'],
  7:  ['T', '1', '2', '3'],
  8:  ['T', '1', '2', '4', '5', '6'],
  9:  ['T', '1', '2'],
  10: ['T', '1', '3', '4'],
  11: ['T', '1'],
  12: ['T', '2'],
  13: ['1', '2'],
  14: ['2'],

  if (offset < 0) return null;
  const base = (o) => {
    if (german && RECORDER_GERMAN_DIFF[o]) return RECORDER_GERMAN_DIFF[o].slice();
    return RECORDER_BAROQUE[o] ? RECORDER_BAROQUE[o].slice() : null;
  };
  if (offset <= 14) {
    const f = base(offset);
    return f ? { pressed: f, half: [] } : null;
  }
  if (offset <= 26) { // klemgrep
    const f = base(offset - 12);
    if (!f) return null;
    const pressed = f.filter(x => x !== 'T');
    return { pressed: ['T'].concat(pressed), half: ['T'], pinch: true };
  }
  return null;

/* ---------- Strengeinstrumenter, 1. posisjon ---------- */
const STRING_SETS = {
  str_violin: { strings: [55, 62, 69, 76], names: ['G', 'D', 'A', 'E'], span: 7 },
  str_viola:  { strings: [48, 55, 62, 69], names: ['C', 'G', 'D', 'A'], span: 7 },
  str_cello:  { strings: [36, 43, 50, 57], names: ['C', 'G', 'D', 'A'], span: 5 },
  str_bass:   { strings: [40, 45, 50, 55], names: ['E', 'A', 'D', 'G'], span: 5 },

/* ---------- Oppslag ---------- */

// Returnerer null (ingen data) eller et objekt som beskriver grepet
function fingeringFor(ins, writtenMidi, opts) {
  const o = opts || {};
  const id = ins.fing;
  if (!id) return null;

  if (id === 'brass3' || id === 'brass4') {
    const m = writtenMidi + (ins.fsemis || 0);
    const e = FINGERINGS[m];
    if (!e) return null;
    return { kind: 'valves', layout: id, pressed: e.f === '0' ? [] : e.f.split(''),
             label: e.f, alts: (e.a || []), note: e.i || null };
  }
  if (id === 'horn_f') {
    const h = harmonicFingering(writtenMidi, 36); // skrevet C2 som grunntone
    if (!h) return null;
    const f = DROP_VALVE[h.drop];
    return { kind: 'valves', layout: 'brass3', pressed: f === '0' ? [] : f.split(''),
             label: f, alts: h.alts.map(d => DROP_VALVE[d]), note: null };
  }
  if (id === 'slide') {
    const root = ins.id === 'basstrombone' ? 34 : 34; // B♭1
    const h = harmonicFingering(writtenMidi, root);
    if (!h) return null;
    return { kind: 'slide', pos: h.drop + 1, alts: h.alts.map(d => d + 1) };
  }
  if (id === 'keys') return { kind: 'keys', midi: writtenMidi };
  if (STRING_SETS[id]) {
    const s = STRING_SETS[id];
    const map = (id === 'str_cello' || id === 'str_bass') ? FINGER_LO : FINGER_HI;
    for (let i = s.strings.length - 1; i >= 0; i--) {
      const off = writtenMidi - s.strings[i];
      if (off >= 0 && off <= s.span && map[off] !== undefined) {
        return { kind: 'strings', set: id, string: i, offset: off, finger: map[off] };
      }
    }
    return null;
  }
  if (id === 'rec_c' || id === 'rec_f') {
    const low = id === 'rec_c' ? 60 : 65;
    const r = recorderFingering(writtenMidi - low, o.german);
    if (!r) return null;
    return { kind: 'holes', layout: 'recorder', pressed: r.pressed, half: r.half || [], pinch: !!r.pinch };
  }
  if (id === 'sax') {
    let m = writtenMidi, oct = false;
    if (m >= 74 && m <= 85) { m -= 12; oct = true; }
    const f = SAX_BASE[m];
    if (!f) return null;
    const pressed = (oct ? ['T'] : []).concat(f);
    const alts = (SAX_ALTS[m] || []).map(a => (oct ? ['T'] : []).concat(a));
    return { kind: 'holes', layout: 'sax', pressed, half: [], alts };
  }
  if (id === 'flute') {
    let m = writtenMidi;
    if (m >= 74 && m <= 85) m -= 12;          // 2. oktav: samme grep
    const f = FLUTE_BASE[m];
    if (!f) return null;
    return { kind: 'holes', layout: 'flute', pressed: f.slice(), half: [],
             alts: (FLUTE_ALTS[m] || []).map(a => a.slice()) };
  }

    const m = writtenMidi;
    if (m >= 52 && m <= 70) {
      const f = CLAR_CHAL[m];
      return f ? { kind: 'holes', layout: 'clarinet', pressed: f.slice(), half: [] } : null;
    }
    if (m >= 71 && m <= 85) {                  // klangregister: duodesim opp (19 halvtoner)

      if (!f) return null;
      return { kind: 'holes', layout: 'clarinet', pressed: ['R'].concat(f), half: [], over: true };

/* ================================================================

const INK = '#1c1712', PAPER = '#fff', DIM = '#bdb29a', HILITE = '#f2b234';

        font-weight="700" fill="${mode === 'on' ? PAPER : DIM}">${k.label}</text>` : '';

  if (mode === 'half') {
    extra = `<path d="M ${k.x - k.r} ${k.y} A ${k.r} ${k.r} 0 0 0 ${k.x + k.r} ${k.y} Z" fill="${INK}"/>`;
  }

}

  const body = L.keys.map(k => keyShape(k, hf.has(k.id) ? 'half' : (on.has(k.id) ? 'on' : 'off'))).join('');
  return svgWrap(L.w, L.h, body, 'fing-' + layoutId);
}
function slideSVG(pos) {

  let s = `<rect x="${x0}" y="${y - 5}" width="${x1 - x0}" height="10" rx="5" fill="none" stroke="${INK}" stroke-width="2"/>`;
  for (let i = 1; i <= 7; i++) {
    const x = x0 + (x1 - x0) * (i - 1) / 6;
    const act = i === pos;
    s += `<circle cx="${x}" cy="${y}" r="${act ? 11 : 5.5}" fill="${act ? INK : PAPER}" stroke="${INK}" stroke-width="2"/>`;
    s += `<text x="${x}" y="${act ? y + 4.5 : y + 24}" text-anchor="middle" font-size="${act ? 13 : 10}"

}
const BLACK_PC = { 1: 1, 3: 1, 6: 1, 8: 1, 10: 1 };
function keysSVG(midi) {
  const start = 12 * Math.floor(midi / 12);      // C i tonens oktav
  const ww = 15, wh = 96, bw = 9.5, bh = 60, n = 14;
  const whiteOffsets = [0, 2, 4, 5, 7, 9, 11];
  let whites = '', blacks = '', idx = 0;
  for (let o = 0; o < 2; o++) for (let i = 0; i < 7; i++, idx++) {
    const m = start + o * 12 + whiteOffsets[i];
    const x = idx * ww;
    const on = m === midi;
    whites += `<rect x="${x}" y="0" width="${ww}" height="${wh}" fill="${on ? HILITE : PAPER}" stroke="${INK}" stroke-width="1.6"/>`;
    const bm = m + 1;
    if (BLACK_PC[((bm % 12) + 12) % 12] && i !== 2 && i !== 6) {

      const bon = bm === midi;

  for (let i = 0; i < 4; i++) {
    const x = x0 + i * gap;
    out += `<line x1="${x}" y1="${top}" x2="${x}" y2="${bot}" stroke="${INK}" stroke-width="${1 + i * 0.5}"/>`;
    out += `<text x="${x}" y="${top - 22}" text-anchor="middle" font-size="10" font-weight="700" fill="${DIM}">${s.names[i]}</text>`;
  }
  const x = x0 + stringIdx * gap;
  if (offset === 0) {
    out += `<circle cx="${x}" cy="${top - 15}" r="6.5" fill="${PAPER}" stroke="${INK}" stroke-width="2.4"/>`;
  } else {
    const y = top + (bot - top) * (offset / (s.span + 1));
    out += `<circle cx="${x}" cy="${y}" r="8.5" fill="${INK}"/>`;
    out += `<text x="${x}" y="${y + 3.5}" text-anchor="middle" font-size="10" font-weight="800" fill="${PAPER}">${finger}</text>`;

function renderFingering(res) {
  if (!res) return null;
  if (res.kind === 'valves') return { svg: diagramSVG(res.layout, res.pressed, []), label: res.label, note: res.note, alts: res.alts };
  if (res.kind === 'holes')  return { svg: diagramSVG(res.layout, res.pressed, res.half), label: '', alts: res.alts };
  if (res.kind === 'slide')  return { svg: slideSVG(res.pos), label: String(res.pos), alts: res.alts };
  if (res.kind === 'keys')   return { svg: keysSVG(res.midi), label: '' };
  if (res.kind === 'strings') return { svg: stringsSVG(res.set, res.string, res.offset, res.finger), label: res.finger };

  if (ins.fing) {

function setupStripDrag(el) {
  let down = false, moved = false, pid = null, start = 0, base = 0;
  let justDragged = false, vertical = false, snapTimer = null;
  el.addEventListener('pointerdown', e => {
    vertical = curDir() === 'v';
    // Vannrett har egen rulling for berøring; loddrett må håndtere alt selv
    if (!vertical && e.pointerType !== 'mouse' && e.pointerType !== 'pen') return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    down = true; moved = false; pid = e.pointerId;
    start = vertical ? e.clientY : e.clientX;
    base = vertical ? vY : el.scrollLeft;
  });
  el.addEventListener('pointermove', e => {
    if (!down || e.pointerId !== pid) return;
    const d = (vertical ? e.clientY : e.clientX) - start;
    if (!moved) {
      if (Math.abs(d) < 5) return;
      moved = true;
      el.classList.add('grabbing');
      if (vertical) stopIfPlaying();
      try { el.setPointerCapture(pid); } catch (err) { /* ignorer */ }
    }
    if (vertical) setLanes(indexAtOffset(base + d), 'none');
    else el.scrollLeft = base - d;
    e.preventDefault();
  });
  const end = () => {
    if (!down) return;
    down = false;
    el.classList.remove('grabbing');
    try { el.releasePointerCapture(pid); } catch (err) { /* ignorer */ }
    justDragged = moved;
    if (moved && vertical) snapStripLane();
    moved = false;
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('lostpointercapture', end);
  // Et dra skal ikke telle som et trykk på tonen man slapp over
  el.addEventListener('click', e => {
    if (!justDragged) return;
    justDragged = false;
    e.stopPropagation();
    e.preventDefault();
  }, true);
  el.addEventListener('wheel', e => {
    if (curDir() === 'v') {
      stopIfPlaying();
      setLanes(indexAtOffset(vY + e.deltaY), 'none');
      clearTimeout(snapTimer);
      snapTimer = setTimeout(snapStripLane, 140);
      e.preventDefault();
      return;
    }
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;   // vannrett hjul virker allerede
    el.scrollLeft += e.deltaY;
    e.preventDefault();
  }, { passive: false });
  el.addEventListener('dragstart', e => e.preventDefault());
}

/* ---------------- AI-prompt ----------------
   Én ferdig prompt: brukerens ønske på valgt språk, og beskrivelsen av
   notasjonen på engelsk, som modellene håndterer best. */
function promptBaseUrl() {
  if (location.protocol === 'file:') return 'https://punnerud.github.io/visualnotes/';
  return location.origin + location.pathname;
}
function midiName(m) {
  const n = spellMidi(m);
  return n.letter + (n.alt > 0 ? '#' : n.alt < 0 ? 'b' : '') + n.oct;
}
function enName(id) { return (I18N.en && I18N.en.instruments && I18N.en.instruments[id]) || id; }
function instrCatalog() {
  return INSTR_GROUP_ORDER.map(g => {
    const list = INSTRUMENTS.filter(x => x.group === g).map(x => `${x.id} (${enName(x.id)})`).join(', ');
    return '  ' + g + ': ' + list;
  }).join('\n');
}
function buildPrompt(wish) {
  const ins = curInstr();
  const r = chartRange(ins);
  const w = (wish || '').trim() || T('ui.aiWishDefault');
  const intro = T('ui.aiIntro', { wish: w });
  const spec =
`--- REFERENCE: how a visualnotes link is built (English) ---

Base URL: ${promptBaseUrl()}
Everything is a query parameter. Working example:
${promptBaseUrl()}?s=C4+D+E+F+G:2+G:2+|+A*4+G:4&t=Lisa+gikk+til+skolen&i=tromp_bb&l=${state.lang}&ts=4/4&bpm=100

s=    the melody: one token per note, separated by spaces (write spaces as + in the URL).
      Pitch     C4  D  E  F#4  Bb3  Ciss  Hess  do re mi
                Both H and B mean B natural. B flat is written Bb (or Hess).
      Octave    the digit after the letter, C4 = middle C. Leave it out and the note nearest the
                previous one is chosen, unless that leap is larger than a fifth.
      Length    append ":" and the number of beats. C:2 = half note, C:.5 = eighth,
                C:1.5 = dotted quarter. Named values work too: :w :h :q :e :s, and a trailing
                dot means dotted (:q.). A token without ":" is one beat (a quarter note).
      Rest      -   with a length like -:2
      Repeat    A*4 repeats that token four times
      Phrase    |   small gap between phrases;  || also breaks the line when printing
      Tie       C~ C  joins two notes of the same pitch into one longer note
v=    alternative to s= for 3-valve brass: valve numbers, e.g. 0 13 12 1 0 0 12*4
t=    title shown at the top
i=    instrument id (list below)
l=    interface language: no, sv, da or en
ts=   time signature, e.g. 4/4, 3/4, 6/8        up=  upbeat (pickup) in beats
bpm=  tempo, 30-240                             k=   transpose everything n semitones
p=    w (default) means the tokens are exactly what the player reads on the chosen instrument.
      p=c means the tokens are concert pitch and get transposed for each instrument.
w=    optional lyric syllables, one per note, separated by |
auto=1 starts playback, met=0 turns the metronome off, tone=0 turns the sound off

Rules to follow:
- Every bar must add up: the note lengths between two bar boundaries must equal the time signature.
- Keep the melody inside the instrument's written range, or it is shown without a fingering.
- Encode spaces as + and leave : | * - ~ # as they are.
- Return one single URL on one line.

Currently chosen (keep unless I ask for something else):
  i=${ins.id} — ${enName(ins.id)}, ${ins.clef} clef, written range ${midiName(r.lo)}-${midiName(r.hi)}${ins.fing ? '' : ' (no fingering chart)'}
  l=${state.lang}   ts=${state.ts}   bpm=${state.bpm}

Instrument ids:
${instrCatalog()}`;
  return intro + '\n\n' + spec + '\n';
}

function currentSongSnippet() {
  const ins = curInstr();
  const bits = ['i=' + ins.id, 'ts=' + state.ts, 'bpm=' + state.bpm, 'l=' + state.lang];
  if (state.transpose) bits.push('k=' + state.transpose);
  if (state.pitchMode !== 'written') bits.push('p=c');
  return T('ui.aiInclude') + '\n' +
    's=' + state.sourceText + '\n' +
    (state.title ? 't=' + state.title + '\n' : '') +
    bits.join('  ');
}

function insertSongSnippet(ta) {
  const label = T('ui.aiInclude');
  let rest = ta.value;
  const at = rest.indexOf(label);
  if (at >= 0) {
    const tail = rest.slice(at);
    const end = tail.indexOf('\n\n');
    rest = (rest.slice(0, at) + (end >= 0 ? tail.slice(end + 2) : '')).replace(/^\s+/, '');
  }
  ta.value = currentSongSnippet() + '\n\n' + rest;
  ta.dispatchEvent(new Event('input', { bubbles: true }));
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
}

}

/* ================================================================
   Tilstand, cookie, URL og oppstart
   ================================================================ */
const COOKIE = 'visualnotes';
const DEFAULTS = {
  lang: 'no', instrId: 'tromp_bb', naming: 'native', pitchMode: 'written', recorderGerman: false,
  bpm: 100, ts: '4/4', upbeat: 0, auto: false, metronome: true, tone: true, countIn: 4,
  air: 0.6, showFing: true, showBars: true, showOct: true, transpose: 0,
  dir: 'auto', pRows: 11, pZoom: 0.8, pLand: true,
};
const PERSIST = ['lang', 'instrId', 'naming', 'pitchMode', 'recorderGerman', 'bpm', 'auto',
                 'metronome', 'tone', 'countIn', 'air', 'showFing', 'showBars', 'showOct',
                 'dir', 'pRows', 'pZoom', 'pLand'];
const state = Object.assign({}, DEFAULTS, {
  title: '', songId: null, sourceText: '', events: [], cur: 0, words: null, parseErrors: [],
  transposeLocked: false, bpmDefault: 100, aiWish: '',
});

function readCookie() {
  const m = document.cookie.match(new RegExp('(?:^|; )' + COOKIE + '=([^;]*)'));
  if (!m) return {};
  try { return JSON.parse(decodeURIComponent(m[1])) || {}; } catch (e) { return {}; }
}
function saveState() {
  const o = {};
  PERSIST.forEach(k => { o[k] = state[k]; });
  try {
    document.cookie = COOKIE + '=' + encodeURIComponent(JSON.stringify(o)) +
      ';path=/;max-age=31536000;SameSite=Lax';
  } catch (e) { /* ignorer */ }
}
function setInstrument(id) {
  if (!INSTR_BY_ID[id]) return;
  stopIfPlaying();                    // gammelt instrument ligger i planleggeren
  state.instrId = id;
  autoOctave();
  saveState(); rebuildAll(); syncUrl();
}
/* Flytter sangen oktavvis slik at den ligger innenfor instrumentets register.
   Rører ikke noe hvis den allerede passer, eller hvis brukeren har valgt transponering selv. */
function autoOctave() {
  if (state.transposeLocked) return;
  const ins = curInstr();
  const notes = state.events.filter(e => !e.rest);
  if (!notes.length) return;
  const lo = Math.min.apply(null, notes.map(e => e.midi));
  const hi = Math.max.apply(null, notes.map(e => e.midi));
  const rng = chartRange(ins);
  const fits = k => (lo + k * 12) >= rng.lo && (hi + k * 12) <= rng.hi;
  if (fits(0)) { state.transpose = 0; return; }
  for (let d = 1; d <= 3; d++) {
    if (fits(-d)) { state.transpose = -d * 12; return; }
    if (fits(d)) { state.transpose = d * 12; return; }
  }
  // Ingen oktav passer helt: velg den som gir færrest toner utenfor
  let best = 0, bestOut = Infinity;
  for (let k = -3; k <= 3; k++) {
    const out = notes.filter(e => e.midi + k * 12 < rng.lo || e.midi + k * 12 > rng.hi).length;
    if (out < bestOut) { bestOut = out; best = k; }
  }
  state.transpose = best * 12;
}
function setSource(text, kind, keepSong) {
  stopIfPlaying();                    // ellers spiller den forrige melodien videre
  if (!keepSong) state.songId = null;
  state.sourceText = String(text || '').trim();
  let r;
  if (kind === 'valves') {
    // Ventiltall gir skrevet tonehøyde direkte — ingen transponering
    r = parseValves(state.sourceText, { startMidi: 60 });
    state.sourceText = songToTokens(r.events);
  } else {
    r = parseSong(state.sourceText, { startOct: 4 });
  }
  state.parseErrors = r.errors;
  state.events = markBars(r.events, state.ts, state.upbeat);
  state.cur = 0;
  autoOctave();
  rebuildAll();
  syncUrl();
}
function loadSong(id) {
  const s = SONG_BY_ID[id];
  if (!s) return;
  state.songId = id;
  state.title = s.title[state.lang] || s.title.en;
  state.ts = s.ts; state.bpm = s.bpm; state.bpmDefault = s.bpm;
  state.upbeat = s.upbeat || 0; state.words = null;
  state.transposeLocked = false;
  setSource(s.s, null, true);
  go(0, true);
}
function rebuildAll() {
  if (state.songId && SONG_BY_ID[state.songId]) {
    state.title = SONG_BY_ID[state.songId].title[state.lang] || SONG_BY_ID[state.songId].title.en;
  }
  state.events = markBars(state.events, state.ts, state.upbeat);
  computeBeatIndex();
  renderStrip();
  renderLegend();
  updateTempoBar();
  go(state.cur, true);
}

/* ---------------- URL ---------------- */
const P_ALIAS = { song: 's', notes: 's', instrument: 'i', instr: 'i', lang: 'l', title: 't',
                  tempo: 'bpm', pitch: 'p', words: 'w', valves: 'v', key: 'k' };
function query() {
  const p = new URLSearchParams(location.search);
  const o = {};
  p.forEach((v, k) => { o[P_ALIAS[k] || k] = v; });
  return o;
}
function applyQuery(q) {
  if (q.l && LANG_ORDER.indexOf(q.l) >= 0) state.lang = q.l;
  if (q.i && INSTR_BY_ID[q.i]) state.instrId = q.i;
  if (q.ts && /^\d+\/\d+$/.test(q.ts)) state.ts = q.ts;
  if (q.up !== undefined) state.upbeat = Math.max(0, parseFloat(q.up) || 0);
  if (q.bpm) { state.bpm = clamp(parseInt(q.bpm, 10) || DEFAULTS.bpm, 30, 240); state.bpmDefault = state.bpm; }
  if (q.p === 'c' || q.p === 'concert') state.pitchMode = 'concert';
  if (q.p === 'w' || q.p === 'written') state.pitchMode = 'written';
  if (q.k) { state.transpose = clamp(parseInt(q.k, 10) || 0, -24, 24); state.transposeLocked = true; }
  if (q.n === 'intl' || q.n === 'native') state.naming = q.n;
  if (q.dir === 'auto' || q.dir === 'h' || q.dir === 'v') state.dir = q.dir;
  ['auto', 'met', 'tone'].forEach(k => {
    if (q[k] !== undefined) {
      const v = q[k] !== '0' && q[k] !== 'false';
      if (k === 'auto') state.auto = v; else if (k === 'met') state.metronome = v; else state.tone = v;
    }
  });
  if (q.count !== undefined) state.countIn = clamp(parseInt(q.count, 10) || 0, 0, 8);
  if (q.air !== undefined) state.air = clamp(parseFloat(q.air), 0, 1.6);
  if (q.fing !== undefined) state.showFing = q.fing !== '0';
  if (q.bars !== undefined) state.showBars = q.bars !== '0';
  if (q.w) state.words = q.w.split('|').map(x => x.trim());
  if (q.t) state.title = q.t;

  if (q.id && SONG_BY_ID[q.id]) {
    const s = SONG_BY_ID[q.id];
    state.songId = q.id;
    if (!q.t) state.title = s.title[state.lang] || s.title.en;
    if (!q.ts) state.ts = s.ts;
    if (!q.bpm) { state.bpm = s.bpm; state.bpmDefault = s.bpm; }
    state.upbeat = q.up !== undefined ? state.upbeat : (s.upbeat || 0);
    setSource(s.s, null, true);
    return true;
  }
  if (q.v) { setSource(q.v, 'valves'); return true; }
  if (q.s) { setSource(q.s); return true; }
  return false;
}
function buildUrl() {
  const p = [];
  // Tegn som er trygge i en query og gjør lenka lesbar, holdes ukodet
  const add = (k, v) => p.push(k + '=' + encodeURIComponent(v)
    .replace(/%20/g, '+').replace(/%3A/g, ':').replace(/%7C/g, '|')
    .replace(/%2C/g, ',').replace(/%2F/g, '/'));
  if (state.songId) add('id', state.songId);
  else add('s', state.sourceText);
  if (state.title && (!state.songId || state.title !== (SONG_BY_ID[state.songId].title[state.lang] || ''))) add('t', state.title);
  add('i', state.instrId);
  add('l', state.lang);
  if (state.ts !== '4/4') add('ts', state.ts);
  if (state.upbeat) add('up', state.upbeat);
  if (state.bpm !== DEFAULTS.bpm) add('bpm', state.bpm);
  if (state.pitchMode !== 'written') add('p', 'c');
  if (state.dir !== 'auto') add('dir', state.dir);
  if (state.transpose) add('k', state.transpose);
  if (state.auto !== DEFAULTS.auto) add('auto', state.auto ? 1 : 0);
  if (state.metronome !== DEFAULTS.metronome) add('met', state.metronome ? 1 : 0);
  if (state.tone !== DEFAULTS.tone) add('tone', state.tone ? 1 : 0);
  if (state.words) add('w', state.words.join('|'));
  return location.origin + location.pathname + '?' + p.join('&');
}
function syncUrl() {
  try { history.replaceState(null, '', buildUrl()); } catch (e) { /* ignorer */ }
}

/* ---------------- Avspilling ---------------- */
function stopIfPlaying() { if (player.playing) { stopPlayback(); freezeLanes(); updatePlayBtn(); } }
function updatePlayBtn() {
  const b = $('playBtn');
  b.textContent = player.playing ? '⏸' : '▶';
  b.classList.toggle('on', player.playing);
  b.setAttribute('aria-label', T(player.playing ? 'ui.pause' : 'ui.play'));
}
function beginPlayback(from, countIn) {
  if (!state.events.length) return false;
  const ins = curInstr();
  player.onNote = i => { go(i); flash(i); };
  player.onStop = () => { updatePlayBtn(); freezeLanes(); };
  const sounding = state.events.map(e => Object.assign({}, e, { midi: e.rest ? null : soundingMidi(e) }));
  const ok = startPlayback(sounding, {
    bpm: state.bpm, ts: state.ts, upbeat: state.upbeat, from: from || 0,
    metronome: state.metronome, tone: state.tone,
    countIn: countIn === undefined ? state.countIn : countIn,
    transpose: 0, group: ins.group,
  });
  updatePlayBtn();
  if (ok) {
    const lead = AC ? player.t0 - AC.currentTime : 0;
    glideBand(from || 0, lead);
    if (curDir() === 'v') positionStripLane(true);
  }
  return ok;
}
function playPause() {
  if (player.playing) { stopPlayback(); freezeLanes(); updatePlayBtn(); return; }
  go(0, true);                       // ▶ spiller alltid sangen fra begynnelsen
  beginPlayback(0);
}
let flashTimer = null;
function flash(i) {
  cards.forEach(c => c.classList.remove('beat'));
  const el = cards[i];
  if (!el) return;
  el.classList.add('beat');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => el.classList.remove('beat'), 140);
}

/* Automatisk start: nettleseren tillater ikke lyd før brukeren har rørt siden,
   så vi prøver med én gang, og ellers ved første trykk eller tastetrykk. */
function armAutoStart() {
  let started = false;
  const kick = () => {
    if (started || player.playing) return;
    started = true;
    document.removeEventListener('pointerdown', kick);
    document.removeEventListener('keydown', kick);
    playPause();
  };
  setTimeout(() => {
    const ac = ensureAC();
    if (ac && ac.state === 'running') kick();
    else {
      document.addEventListener('pointerdown', kick);
      document.addEventListener('keydown', kick);
    }
  }, 300);
}

/* ---------------- Oppstart ---------------- */
function init() {
  Object.assign(state, DEFAULTS);
  const nav = langFromNavigator(navigator.language || (navigator.languages || [])[0]);
  if (nav) state.lang = nav;
  const saved = readCookie();
  PERSIST.forEach(k => { if (saved[k] !== undefined) state[k] = saved[k]; });
  const q = query();
  const loaded = applyQuery(q);
  if (!loaded) loadSong('lisa');
  saveState();

  $('prev').addEventListener('click', () => { stopIfPlaying(); go(state.cur - 1); });
  $('next').addEventListener('click', () => { stopIfPlaying(); go(state.cur + 1); });
  $('playBtn').addEventListener('click', playPause);
  $('bpmM').addEventListener('click', () => applyTempo(steppedTempo(-1)));
  $('bpmP').addEventListener('click', () => applyTempo(steppedTempo(1)));
  $('bpmVal').addEventListener('click', editTempo);
  $('bpmReset').addEventListener('click', () => applyTempo(state.bpmDefault));
  $('bpmInput').addEventListener('blur', () => commitTempo(true));
  $('bpmInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commitTempo(true); }
    else if (e.key === 'Escape') { e.preventDefault(); commitTempo(false); }
  });
  $('openAi').addEventListener('click', () => { renderAi(); openSheet('ai'); });
  $('openSettings').addEventListener('click', () => { renderSettings(); openSheet('settings'); });
  $('openSongs').addEventListener('click', () => { renderSongs(); openSheet('songs'); });
  $('openShare').addEventListener('click', () => { renderShare(); openSheet('share'); });
  document.querySelectorAll('[data-close]').forEach(b =>
    b.addEventListener('click', () => closeSheet(b.dataset.close)));
  document.querySelectorAll('.sheet').forEach(s =>
    s.addEventListener('click', e => { if (e.target === s) s.hidden = true; }));

  $('pclose').addEventListener('click', () => { $('printview').hidden = true; });
  $('doPrint').addEventListener('click', () => window.print());
  const printSet = (k, v) => { state[k] = v; saveState(); renderPrint(); };
  $('rowM').addEventListener('click', () => printSet('pRows', Math.max(3, state.pRows - 1)));
  $('rowP').addEventListener('click', () => printSet('pRows', Math.min(40, state.pRows + 1)));
  $('zM').addEventListener('click', () => printSet('pZoom', Math.max(0.3, +(state.pZoom - 0.1).toFixed(2))));
  $('zP').addEventListener('click', () => printSet('pZoom', Math.min(1.6, +(state.pZoom + 0.1).toFixed(2))));
  $('orient').addEventListener('click', () => printSet('pLand', !state.pLand));

  document.addEventListener('keydown', e => {
    const openSheetEl = document.querySelector('.sheet:not([hidden])');
    if (e.key === 'Escape') {
      if (openSheetEl) { openSheetEl.hidden = true; return; }
      if (!$('printview').hidden) { $('printview').hidden = true; return; }
    }
    if (openSheetEl || !$('printview').hidden) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '')) return;
    // I loddrett modus ligger neste tone over, så Opp = neste
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); stopIfPlaying(); go(state.cur + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); stopIfPlaying(); go(state.cur - 1); }
    else if (e.key === ' ') { e.preventDefault(); playPause(); }
  });
  window.addEventListener('resize', () => {
    if (player.playing) return;
    if (curDir() === 'v') positionStripLane(true);
    else centerCard(cards[state.cur], true);
    positionBand(true);
  });
  setupStripDrag($('strip'));

  rebuildAll();
  updateTempoBar();
  updatePlayBtn();
  go(state.cur, true);
  if (state.auto) armAutoStart();
  window.__app = { state, go, setSource, loadSong, setInstrument, buildUrl, rebuildAll };
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

</script>
</body>
</html>
